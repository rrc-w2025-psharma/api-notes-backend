name: Shai-Hulud 2.0 Security Check

on:
  push:
    branches: [main, development, security]
  pull_request:
    branches: [main, development, security]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gensecaihq/Shai-Hulud-2.0-Detector@v2
        with:
          fail-on-critical: true